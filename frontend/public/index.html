<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Charset y compatibilidad -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Viewport para responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=yes" />
    
    <!-- Color del tema para navegadores móviles -->
    <meta name="theme-color" content="#2563eb" />
    
    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/car-icon.png?v=2" type="image/png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/car-icon.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/car-icon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Sistema de gestión de estacionamiento inteligente - Control total de vehículos, pagos y accesos con facturación electrónica AFIP"
    />
    <meta name="keywords" content="estacionamiento, parking, gestión, vehículos, AFIP, facturación" />
    <meta name="author" content="EstacionGian" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EstacionGian - Sistema de Estacionamiento" />
    <meta property="og:description" content="Sistema de gestión de estacionamiento inteligente" />
    <meta property="og:image" content="%PUBLIC_URL%/car-icon.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EstacionGian - Sistema de Estacionamiento" />
    <meta name="twitter:description" content="Sistema de gestión de estacionamiento inteligente" />
    
    <!-- DNS Prefetch para mejor performance -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    
    <title>EstacionGian - Sistema de Estacionamiento</title>
  </head>
  <body>
    <!-- Mensaje para navegadores sin JavaScript -->
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: Arial, sans-serif;">
        <h1>⚠️ JavaScript Requerido</h1>
        <p>Esta aplicación requiere JavaScript para funcionar correctamente.</p>
        <p>Por favor, habilita JavaScript en tu navegador e intenta nuevamente.</p>
      </div>
    </noscript>
    
    <!-- Root element para React -->
    <div id="root"></div>
  </body>
</html>
