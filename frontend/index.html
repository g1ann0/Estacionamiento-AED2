<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/car-icon.png?v=2" type="image/png" />
    <link rel="shortcut icon" href="/car-icon.png?v=2" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Sistema de gestión de estacionamiento inteligente - Control total de vehículos, pagos y accesos"
    />
    <link rel="apple-touch-icon" href="/car-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>EstacionGian - Sistema de Estacionamiento</title>
    <script>
      // Se ejecuta antes del primer pintado para evitar el flash de tema equivocado: si el
      // atributo se pusiera recién al montar React, una máquina en oscuro vería un destello
      // blanco en cada carga. En 'sistema' no se escribe nada, y manda prefers-color-scheme.
      (function () {
        try {
          var t = localStorage.getItem('panel-tema');
          if (t === 'oscuro') document.documentElement.setAttribute('data-theme', 'dark');
          else if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Necesitás habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
